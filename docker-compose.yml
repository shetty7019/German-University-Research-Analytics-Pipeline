services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: openalex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d openalex"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pipeline

  s3:
    image: chrislusf/seaweedfs:latest
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: lake-admin
      AWS_SECRET_ACCESS_KEY: lake-secret-key
    ports:
      - "8333:8333"   # S3 API (what boto3 talks to)
      - "8888:8888"   # file browser UI
    volumes:
      - s3data:/data
    networks:
      - pipeline

  pipeline:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://pipeline:pipeline@postgres:5432/openalex
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL-http://s3:8333}
      S3_BUCKET: openalex-lake
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-lake-admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-lake-secret-key}
      AWS_DEFAULT_REGION: eu-central-1
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
    command: ["openalex-pipeline"]
    networks:
      - pipeline

  dbt:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DBT_HOST: postgres
      DBT_USER: pipeline
      DBT_PASSWORD: pipeline
      DBT_DB: openalex
      DBT_SCHEMA: analytics
      DBT_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["dbt", "build", "--project-dir", "dbt", "--profiles-dir", "dbt"]
    networks:
      - pipeline

  integration-check:
    build: .
    environment:
      DATABASE_URL: postgresql://pipeline:pipeline@postgres:5432/openalex
      S3_ENDPOINT_URL: http://s3:8333
      S3_BUCKET: openalex-lake
      AWS_ACCESS_KEY_ID: lake-admin
      AWS_SECRET_ACCESS_KEY: lake-secret-key
      AWS_DEFAULT_REGION: eu-central-1
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
    command: ["python", "scripts/local_integration_check.py"]
    networks:
      - pipeline

volumes:
  pgdata:
  s3data:

networks:
  pipeline: