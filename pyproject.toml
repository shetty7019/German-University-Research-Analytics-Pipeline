[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openalex-research-pipeline"
version = "0.1.0"
description = "An idempotent OpenAlex research-output data pipeline"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34,<2",
  "psycopg[binary]>=3.1,<4",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
openalex-pipeline = "openalex_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"